# Builds a SwarfGRBL release on GitHub's macOS runners (free for a public repo).
#
# Push a tag (git tag v2.1 && git push origin v2.1) and this builds the universal app, SwarfGRBL.dmg,
# SwarfGRBL.zip and appcast.xml (scripts/release.sh) and makes a GitHub Release from them. The
# release is only published once the build is signed and notarized; until the Apple secrets are
# set it's left as a draft, which neither the website link nor Sparkle (releases/latest) can see.
# Run it by hand (Actions → Release → Run workflow) to just build and keep the files as an artifact.
#
# Secrets (all optional; see docs/RELEASING.md):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD   Developer ID Application certificate (.p12, base64) and its password
#   NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key for notarization
#   SPARKLE_ED_PRIVATE_KEY                signs updates (the public half is scripts/sparkle-public-key.txt)
name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 2.1-test); nothing is published
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh reads the tag and commit time

      - name: Version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test
        run: swift test --package-path swift

      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Notary key
        if: env.NOTARY_KEY_P8 != ''
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/release.sh "$VERSION"

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: SwarfGRBL-${{ env.VERSION }}
          path: |
            dist/SwarfGRBL.dmg
            dist/SwarfGRBL.zip
            dist/appcast.xml
            dist/release.env
          if-no-files-found: ignore

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dist/release.env
          files=(dist/SwarfGRBL.dmg dist/SwarfGRBL.zip)
          [[ "$APPCAST" == 1 ]] && files+=(dist/appcast.xml)
          flags=(--title "SwarfGRBL $VERSION" --generate-notes --verify-tag)
          if [[ "$NOTARIZED" == 1 && "$APPCAST" == 1 ]]; then
            flags+=(--latest)
          else
            # Not notarized (or no appcast): macOS would refuse to open it, so keep it out of sight.
            flags+=(--draft)
            echo "::warning::Left as a draft: signed=$SIGNED notarized=$NOTARIZED appcast=$APPCAST"
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
